<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8001C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0000F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" fill="#0D0D0D" rx="12"/>

  <!-- Abstract Symbol: Geometric H-inspired mark -->
  <!-- Left vertical bar -->
  <rect x="28" y="32" width="14" height="96" fill="url(#redGrad)" rx="3"/>
  <!-- Right vertical bar -->
  <rect x="74" y="32" width="14" height="96" fill="#1E1E1E" rx="3"/>
  <!-- Crossbar - red accent cutting through -->
  <rect x="28" y="68" width="60" height="12" fill="url(#redGrad)" rx="2"/>
  <!-- Top diagonal accent -->
  <polygon points="42,32 56,32 74,44 74,56" fill="#E8001C" opacity="0.85"/>
  <!-- Small red square detail -->
  <rect x="74" y="32" width="14" height="24" fill="url(#redGrad)" rx="2"/>

  <!-- Thin red underline accent -->
  <rect x="28" y="136" width="60" height="3" fill="#E8001C" rx="1.5"/>

  <!-- HOBERG wordmark -->
  <text
    x="118"
    y="95"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    letter-spacing="6"
    fill="#FFFFFF"
  >HOBERG</text>

  <!-- Tagline -->
  <text
    x="120"
    y="122"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="11"
    font-weight="400"
    letter-spacing="4.5"
    fill="#E8001C"
  >DIGITAL AGENCY</text>

</svg>
